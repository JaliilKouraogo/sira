# Construit l'export statique du site et le publie sur GitHub Pages.
# Déclenché à chaque envoi sur la branche main, ou à la main depuis l'onglet Actions.
# Le dépôt est un monorepo : seule l'application web est publiée ici.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm install plutôt que npm ci : le verrou produit sous Windows omet des
      # dépendances optionnelles propres à Linux. Les versions restent figées
      # dans les package.json.
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund --workspace @sira/web --workspace @sira/shared --include-workspace-root

      - name: Construire l'export statique
        run: npm run build --workspace @sira/web
        env:
          GITHUB_PAGES: "true"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
